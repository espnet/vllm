name: ESPnet Docker image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/espnet-docker.yml'
      - 'examples/espnet/**'
      - 'vllm/**'
      - 'requirements/**'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after validation (requires configured Docker Hub credentials)
        type: boolean
        default: false

permissions:
  contents: read

# One publisher owns the moving tags at a time. Do not interrupt a push.
concurrency:
  group: espnet-docker-main
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'espnet/vllm' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       vars.ESPNET_DOCKER_ENABLED == 'true')
    # Set this JSON array to a native amd64 builder with sufficient disk space.
    runs-on: ${{ fromJSON(vars.ESPNET_DOCKER_RUNNER || '["ubuntu-24.04"]') }}
    environment: docker
    timeout-minutes: 180
    env:
      LOCAL_IMAGE: espnet-vllm:ci-${{ github.run_id }}-${{ github.run_attempt }}
      PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name != 'workflow_dispatch' && vars.ESPNET_DOCKER_PUBLISH == 'true') }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'espnet/vllm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check builder and publication configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/espnet-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          test "$(uname -m)" = x86_64 || {
            echo 'This workflow currently validates and publishes linux/amd64 only.' >&2
            exit 1
          }
          docker info >/dev/null
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          available_kb=$(df -Pk "$docker_root" | awk 'END {print $4}')
          if (( available_kb < 100 * 1024 * 1024 )); then
            echo 'Configure ESPNET_DOCKER_RUNNER with at least 100 GiB free Docker storage.' >&2
            exit 1
          fi
          if [[ "$PUBLISH" == true ]]; then
            [[ "$DOCKERHUB_IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]]
            test -n "$DOCKERHUB_USERNAME"
            test -n "$DOCKERHUB_TOKEN"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build this checkout using the pinned upstream digest
        shell: bash
        run: |
          set -euo pipefail
          examples/espnet/docker/build.sh --arch amd64 --tag "$LOCAL_IMAGE"

      - name: Validate the built image without network or model downloads
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python3 "$LOCAL_IMAGE" \
            -m pip check
          docker run --rm --network none --entrypoint python3 "$LOCAL_IMAGE" \
            /workspace/vllm-fork/examples/espnet/docker/smoke_test.py
          docker run --rm --network none --entrypoint vllm "$LOCAL_IMAGE" serve --help >/dev/null

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push a unique image and update moving tags
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unique_tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-amd64"
          docker tag "$LOCAL_IMAGE" "$DOCKERHUB_IMAGE:$unique_tag"
          docker push "$DOCKERHUB_IMAGE:$unique_tag"
          current_main=$(git ls-remote https://github.com/espnet/vllm.git refs/heads/main | awk '{print $1}')
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "Published $DOCKERHUB_IMAGE:$unique_tag; main advanced, leaving moving tags unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Promote exactly the validated image; do not rebuild for publication.
          docker buildx imagetools create --prefer-index=false \
            --tag "$DOCKERHUB_IMAGE:main-amd64" \
            --tag "$DOCKERHUB_IMAGE:latest" \
            "$DOCKERHUB_IMAGE:$unique_tag"
          {
            echo "Published: $DOCKERHUB_IMAGE:$unique_tag"
            echo "Source: $GITHUB_SHA"
            echo 'Platform: linux/amd64'
            echo 'Checks: dependency consistency, imports and CLI startup; no GPU model inference.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record validation-only result
        if: env.PUBLISH != 'true'
        shell: bash
        run: |
          echo 'Image built and passed CPU smoke checks. No image was published.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove only this job's local image and Docker credentials
        if: always()
        shell: bash
        run: |
          if [[ "$PUBLISH" == true && -n "$DOCKERHUB_IMAGE" ]]; then
            docker image rm "$DOCKERHUB_IMAGE:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" || true
          fi
          docker image rm "$LOCAL_IMAGE" || true
          if [[ -n "${DOCKER_CONFIG:-}" ]]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi
